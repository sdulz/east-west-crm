name: field_crm
description: Mobile CRM for field salespeople and supervisors.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (from name_app)
  flutter_riverpod: ^2.5.1

  # Networking & Storage (from name_app)
  dio: ^5.7.0
  http_parser: ^4.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Drift encrypted offline DB
  drift: ^2.31.0
  sqlite3: ^2.9.4
  sqlcipher_flutter_libs: ^0.6.8
  path: ^1.9.0


  # UI and utilities (from name_app)
  flutter_screenutil: ^5.9.3
  go_router: ^14.8.1
  intl: ^0.20.2
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  connectivity_plus: ^6.0.3
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  mime: ^2.0.0

  # Notifications & Diagnostics
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  sentry_flutter: ^9.30.1
  file_picker: ^11.0.3
  image_picker: ^1.1.2

  # Serialization & Annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  alchemist: ^0.14.1
  patrol: any

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/images/

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
